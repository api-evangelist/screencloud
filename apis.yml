name: ScreenCloud
kind: company
description: ScreenCloud is a cloud digital signage platform that turns any screen
  into a managed display for content, dashboards, and apps. Its developer surface is
  the ScreenCloud Studio API - a single public GraphQL endpoint (bearer-token
  authenticated, region-specific, copied from the DEVELOPER tab in Studio) that lets
  you automate anything you can do in Studio by hand - pairing and managing screens,
  building playlists and channels, uploading media and files, casting content,
  installing and configuring signage apps, and exporting playback logs and QR
  metrics. ScreenCloud also runs a Developer Platform / App framework for building
  custom HTML/JavaScript signage apps that can be published (with approval) to the
  App Store. There is no documented public WebSocket API - the Studio API is
  request/response GraphQL over HTTPS.
