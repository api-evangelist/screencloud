meters:
- name: screen_licenses
  description: Number of licensed screens on the subscription; the primary billing driver, multiplied by the plan per-screen rate.
  unit: screens
  aggregation: sum
  dimensions:
  - account
  - plan
  - space
- name: plan_tier
  description: Per-screen plan rate (Core, Pro, or Enterprise) applied to each licensed screen.
  unit: tier
  aggregation: max
  dimensions:
  - account
- name: premium_addons
  description: Premium apps, integrations, professional services, and hardware/devices billed on top of the base subscription.
  unit: items
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track active screen licenses per space and plan tier so signage spend is attributable to locations and teams.
- name: Allocation
  description: Group screens by space/site and tag them so the per-screen subscription cost maps to internal cost centers and locations.
- name: Optimization
  description: Depair and remove screens that are offline or retired so you stop paying for unused licenses; right-size each screen to Core versus Pro based on whether it actually needs Pro-only features; consolidate content via channels/playlists rather than adding screens.
- name: Accountability
  description: Assign an owner per space/site; review the licensed-screen count against the invoice each billing cycle and reconcile Enterprise quotes at renewal.
