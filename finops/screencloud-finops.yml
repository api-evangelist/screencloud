description: >-
  FinOps view of ScreenCloud spend. ScreenCloud is a per-screen SaaS subscription -
  cost is driven by the number of licensed screens times the plan rate (Core, Pro,
  or Enterprise), billed monthly or annually. The Studio GraphQL API carries no
  separate metered fee; it automates the same account and is not itself a cost
  driver. The dominant, most controllable cost lever is the count of active screen
  licenses and the plan tier each screen sits on.
notes: >-
  Per-screen rates are on the ScreenCloud pricing page and reflected in the plans
  file; Enterprise is quote-only. This is a fixed-subscription model rather than a
  usage-metered API, so there is no per-request billing to allocate.
